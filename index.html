<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>squares</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'Optic';
    src: url('fonts/Optic-Bold.otf') format('opentype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Optic';
    src: url('fonts/Optic-Book.otf') format('opentype');
    font-weight: 400;
  }

  /* one · at · a · time's face, borrowed for the one row on this page that names
     that game — the same way that row borrows its icon. The app sets everything
     in SF Pro Rounded, which `ui-rounded` reaches from the system on Apple
     platforms and which Apple's licence forbids serving from a website; Nunito
     stands in everywhere else. Served from that game's own directory, because it
     belongs to it and not to this page. */
  @font-face {
    font-family: 'Nunito';
    src: url('/oneatatime/fonts/nunito-latin.woff2') format('woff2');
    /* One variable file whose default instance is ExtraLight. Without the range,
       browsers read the whole face as weight 200 and fake anything heavier. */
    font-weight: 200 1000;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --face-oaat: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Optic', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #f5f0eb;
    min-height: 100vh;
    /* Vertically centred when there's room, scrollable when there isn't. Plain
       `justify-content: center` clips the top of an overflowing flex child, and
       the page is now tall enough to overflow a short phone. */
    overflow-x: hidden;
    padding: 36px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 2;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    font-family: 'Optic', sans-serif;
    font-weight: 700;
    font-size: 56px;
    letter-spacing: -1px;
    line-height: 1;
    display: flex;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .logo span {
    color: #1a1a1a;
    transition: color 0.12s ease;
  }
  .logo.sparkle {
    transform: scale(1.1);
  }

  .tagline {
    font-family: 'Optic', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: #888;
    margin-top: 20px;
  }

  .spacer {
    height: 28px;
  }

  .warn-line1 {
    font-family: 'Optic', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: #1a1a1a;
    margin-top: 8px;
  }

  .warn-line2 {
    font-family: 'Optic', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: #1a1a1a;
    margin-top: 12px;
    margin-bottom: 44px;
  }

  .badge {
    display: block;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .badge img {
    display: block;
    height: 54px;
    width: auto;
  }
  .badge:hover { transform: scale(1.03); opacity: 0.9; }
  .badge:active { transform: scale(0.98); }

  /* --- The other game -----------------------------------------------------
     squares is the headline, so this stays quiet: one row, below the badge,
     wearing one chip of the other game's colour rather than its whole
     personality. */
  .sibling {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-top: 40px;
    padding-top: 26px;
    border-top: 1px solid #e2dcd4;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .sibling:hover { opacity: 0.72; }

  /* The game's own app icon, not an approximation of it — the hand-built chip that
     stood here wore a lowercase "a" and the icon uses a capital. */
  .sib-mark {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: block;
  }

  /* This row names the other game, so it is set in that game's face rather than
     in Optic — at Black, which is the weight the app sets its own name in. */
  .sib-text { text-align: left; line-height: 1.35; }
  .sib-text b {
    display: block;
    font-family: var(--face-oaat);
    font-weight: 900;
    font-size: 15px;
    color: #1a1a1a;
    letter-spacing: -0.3px;
  }
  .sib-text em {
    display: block;
    font-family: var(--face-oaat);
    font-weight: 500;
    font-style: normal;
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }

  /* Set in Optic, the face nickpyati.com uses, and cased and tracked the way that
     site sets the name itself. */
  .byline {
    display: inline-block;
    margin-top: 26px;
    font-family: 'Optic', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    color: #bbb;
    transition: color 0.15s ease;
  }
  .byline:hover { color: #888; }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
    .logo span { color: #f5f0eb; }
    .tagline { color: #666; }
    .warn-line1, .warn-line2 { color: #f5f0eb; }
    .sibling { border-top-color: #2e2e2e; }
    .sib-text b { color: #f5f0eb; }
    .sib-text em { color: #777; }
    .byline { color: #555; }
    .byline:hover { color: #888; }
  }
</style>
</head>
<body>

<canvas id="falling"></canvas>

<div class="content">
  <div class="logo" id="logo"><span>s</span><span>q</span><span>u</span><span>a</span><span>r</span><span>e</span><span>s</span></div>
  <div class="tagline">a puzzle game</div>
  <div class="spacer"></div>
  <div class="warn-line1">It looks friendly.</div>
  <div class="warn-line2">It isn't.</div>
  <a class="badge" href="https://apps.apple.com/us/app/squares-a-puzzle-game/id6761150555">
    <picture>
      <source srcset="img/app-store-badge-white.svg" media="(prefers-color-scheme: dark)">
      <img src="img/app-store-badge-black.svg" alt="Download on the App Store">
    </picture>
  </a>
  <div style="margin-top:20px;font-size:11px;font-weight:400;">
    <a href="privacy.html" style="color:#bbb;text-decoration:none;">privacy</a>
    <span style="color:#ccc;margin:0 7px;">&middot;</span>
    <a href="support.html" style="color:#bbb;text-decoration:none;">support</a>
  </div>

  <a class="sibling" href="/oneatatime/">
    <img class="sib-mark" src="/oneatatime/img/icon-180.png" alt="" width="30" height="30">
    <span class="sib-text">
      <b>one &middot; at &middot; a &middot; time</b>
      <em>a word ladder puzzle</em>
    </span>
  </a>

  <a class="byline" href="https://nickpyati.com">Nick Pyati</a>
</div>

<script>
// --- Falling Squares ---
const canvas = document.getElementById('falling');
const ctx = canvas.getContext('2d');

const colors = [
  '#e05a6d', '#5bbf9b', '#e8b84b', '#9b7fc4',
  '#4da6e8', '#e07a3a', '#e05a8a',
];

let squares = [];
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function makeSquare() {
  const size = 16 + Math.random() * 50;
  return {
    x: Math.random() * W,
    y: -size - Math.random() * H * 0.5,
    size,
    color: colors[Math.floor(Math.random() * colors.length)],
    speed: 0.15 + Math.random() * 0.4,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.005,
    opacity: 0.08 + Math.random() * 0.12,
    radius: Math.max(3, size * 0.12),
  };
}

function init() {
  resize();
  squares = [];
  const count = Math.floor((W * H) / 12000);
  for (let i = 0; i < count; i++) {
    const sq = makeSquare();
    sq.y = Math.random() * H;
    squares.push(sq);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const sq of squares) {
    sq.y += sq.speed;
    sq.rotation += sq.rotSpeed;
    if (sq.y > H + sq.size) {
      Object.assign(sq, makeSquare());
      sq.y = -sq.size;
    }
    ctx.save();
    ctx.translate(sq.x + sq.size / 2, sq.y + sq.size / 2);
    ctx.rotate(sq.rotation);
    ctx.globalAlpha = sq.opacity;
    roundRect(-sq.size / 2, -sq.size / 2, sq.size, sq.size, sq.radius);
    ctx.fillStyle = sq.color;
    ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); });
init();
draw();

// --- Rainbow Flash (per-letter offset, like the game) ---
const logo = document.getElementById('logo');
const letters = logo.querySelectorAll('span');
const sparkleColors = ['#e05a6d', '#e07a3a', '#e8b84b', '#5bbf9b', '#4da6e8', '#9b7fc4', '#e05a8a'];
let colorIndex = 0;
let sparkleCount = 0;
const totalCycles = 14; // number of color shifts

setTimeout(() => {
  logo.classList.add('sparkle');

  const interval = setInterval(() => {
    letters.forEach((letter, i) => {
      letter.style.color = sparkleColors[(colorIndex + i) % sparkleColors.length];
    });
    colorIndex++;
    sparkleCount++;

    if (sparkleCount >= totalCycles) {
      clearInterval(interval);
      logo.classList.remove('sparkle');
      letters.forEach(letter => {
        letter.style.color = '#5bbf9b';
      });
    }
  }, 150);
}, 600);
</script>

</body>
