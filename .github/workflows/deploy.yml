name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Embed fonts
        run: |
          mkdir -p fonts
          echo "${{ secrets.OPTIC_BOLD_GZ_B64 }}" | base64 -d | gunzip > fonts/Optic-Bold.otf
          echo "${{ secrets.OPTIC_BOOK_GZ_B64 }}" | base64 -d | gunzip > fonts/Optic-Book.otf

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
