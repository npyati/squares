<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squares</title>
<meta property="og:title" content="squares">
<meta property="og:description" content="Someone shared a board with you. Tap to play.">
<meta property="og:image" content="https://squaresga.me/b/preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; background: #f5f0e8; color: #1a1a1a; }
  h1 { font-size: 24px; font-weight: 700; }
  p { font-size: 16px; color: #666; margin-top: 12px; }
  a { display: inline-block; margin-top: 24px; padding: 14px 32px; background: #1a1a1a; color: #f5f0e8; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px; }
</style>
<script>
(function() {
  var path = window.location.pathname;
  var encoded = path.replace(/^\/b\//, '');
  if (!encoded) return;

  // Try to open the app
  var appURL = 'squares://board/' + encoded;
  var appStoreURL = 'https://apps.apple.com/us/app/squares-a-puzzle-game/id6761150555';

  window.location.href = appURL;

  // If still here after 1.5s, the app didn't open — go to App Store
  setTimeout(function() {
    window.location.href = appStoreURL;
  }, 1500);
})();
</script>
</head>
<body>
  <h1>squares</h1>
  <p>Opening the board in the app...</p>
  <a href="https://apps.apple.com/us/app/squares-a-puzzle-game/id6761150555">Get Squares on the App Store</a>
</body>
</html>
