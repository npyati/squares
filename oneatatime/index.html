<style>
  /* --- Marker ---------------------------------------------------------------
     The game's personality, carried over from the app: a page someone got at
     with highlighters. The letter that moved wears a fluorescent swipe;
     everything else stays pencil.

     One hard rule, inherited from Palette.swift: fluorescent yellow is a fill,
     never a foreground. Anything sitting *on* a swipe uses --on-accent, which
     is dark in BOTH appearances — a fluorescent is bright whichever way the
     system is set.
     ------------------------------------------------------------------------ */
  :root {
    --canvas:    #FCFBF4;
    --hairline:  #E6E3D6;
    --ink:       #141414;
    --ink-soft:  #4F4E48;
    --ink-faint: #93918A;
    --primary:   #FFCF00;
    --success:   #00A870;
    --on-accent: #141414;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:    #15151A;
      --hairline:  #35353F;
      --ink:       #F7F6F0;
      --ink-soft:  #C0BFB6;
      --ink-faint: #77766F;
      --primary:   #FFE23D;
      --success:   #3DFFB0;
      --on-accent: #15151A;
    }
  }

  /* Optic, the face nickpyati.com is set in — used here only for the credit at the
     very bottom, so that link reads as belonging to that site rather than this one.
     The file is injected at deploy time from repository secrets. */
  @font-face {
    font-family: 'Optic';
    src: url('/fonts/Optic-Book.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 56px 24px 40px;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
  }

  /* --- Wordmark ----------------------------------------------------------- */
  /* The same letterforms the game itself wears, lifted from its own SVG. */
  .wordmark { width: 100%; max-width: 320px; height: auto; display: block; }
  .wordmark svg { width: 100%; height: auto; display: block; }

  .tagline {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.01em;
  }

  /* --- The ladder --------------------------------------------------------- */
  .ladder {
    margin: 44px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  /* Three columns rather than a plain row: a gutter for the start/goal labels, the
     four letters, and a mirror of the gutter so the letters stay centred on the page
     whatever the labels say. */
  .rung {
    display: grid;
    grid-template-columns: 46px max-content 46px;
    align-items: center;
  }
  .cells { display: flex; gap: 3px; }

  .tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: right;
    padding-right: 10px;
  }

  /* Both ends of the ladder are on screen from the first frame. Without the goal
     sitting there the animation looked like letters changing for their own sake —
     you couldn't see there was a word being aimed at. */
  .rung.pending { visibility: hidden; }
  .rung.goal { margin-top: 11px; }

  .cell {
    position: relative;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell b {
    position: relative;
    z-index: 1;
    font-size: 29px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--ink);
    transition: color .12s ease .28s, opacity .5s ease;
  }

  /* History. Every rung that isn't live fades to the same degree — the question
     the board answers is "is this the word I'm working on", which is binary.
     Glyph and swipe fade separately rather than through one opacity on the rung:
     compounding 0.32 on the row with another 0.45 on the mark left the swipe at
     0.14, which on cream is not a stain but nothing at all. */
  .rung.past .cell b { opacity: .34; }
  .rung.past .swipe  { opacity: .40; }
  /* On a faded rung the swiped letter keeps its resting ink rather than
     --on-accent: a faded swipe is a stain, not a fill, and dark ink on it
     disappears once the row is dimmed too. */
  .rung.drawn:not(.past) .cell.hit b { color: var(--on-accent); }

  .swipe {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--dy, 0px));
    width: var(--w, 112%);
    height: 66%;
    background: var(--primary);
    border-radius: var(--r, 7px);
    transform: translate(-50%, -50%) rotate(var(--rot, -2deg));
    /* Drawn, not revealed — it's the game's one gesture, so it behaves like a
       gesture. Left to right, the way a real swipe goes. */
    clip-path: inset(0 100% 0 0);
    transition: opacity .5s ease;
  }
  .rung.drawn .swipe { animation: draw .42s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes draw { to { clip-path: inset(0 0 0 0); } }

  .par {
    margin-top: 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--success);
    opacity: 0;
    transform: scale(.9);
  }
  .par.on {
    opacity: 1;
    transform: scale(1);
    transition: opacity .3s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }

  .replay {
    margin-top: 10px;
    background: none;
    border: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity .3s ease, color .15s ease;
  }
  .replay.on { opacity: 1; }
  .replay:hover { color: var(--ink-soft); }

  /* --- Rules -------------------------------------------------------------- */
  .rules {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .rules span:last-child { color: var(--ink-faint); }

  /* --- What's coming ------------------------------------------------------ */
  /* No button. The thing being announced is the app, and there isn't one to link
     to yet — a browser build advertised here would only compete with it. */
  .coming {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px 13px 16px;
    border: 1px solid var(--hairline);
    border-radius: 13px;
  }
  .coming img { width: 34px; height: 34px; border-radius: 8px; display: block; }
  .coming span { font-size: 15px; font-weight: 700; color: var(--ink); }
  .coming em {
    display: block;
    font-style: normal;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* --- Footer ------------------------------------------------------------- */
  footer {
    width: 100%;
    max-width: 420px;
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    text-align: center;
  }
  .meta { font-size: 12px; font-weight: 500; color: var(--ink-faint); }
  .meta a { color: var(--ink-faint); text-decoration: none; }
  .meta a:hover { color: var(--ink-soft); }
  .meta .sep { margin: 0 7px; opacity: .5; }

  /* The other game on this site. Squares is the headline, so it gets a real
     row here rather than a link buried in the fine print — and its own app icon
     rather than an approximation of it. */
  .sibling {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    text-align: left;
    text-decoration: none;
    transition: opacity .15s ease;
  }
  .sibling:hover { opacity: .72; }
  .sibling img { width: 30px; height: 30px; border-radius: 7px; display: block; }
  .sibling b {
    display: block;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: -.2px;
    color: var(--ink);
  }
  .sibling em {
    display: block;
    font-style: normal;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* Set in Optic, the face nickpyati.com uses, and cased and tracked the way that
     site sets the name itself. */
  .byline {
    display: inline-block;
    margin-top: 20px;
    font-family: 'Optic', ui-rounded, system-ui, sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-faint);
    transition: color .15s ease;
  }
  .byline:hover { color: var(--ink-soft); }

  @media (max-width: 400px) {
    body { padding-top: 40px; }
    .cell { width: 38px; height: 38px; }
    .cell b { font-size: 26px; }
    .rung { grid-template-columns: 40px max-content 40px; }
    .tag { font-size: 9px; padding-right: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rung.drawn .swipe { animation: none; clip-path: inset(0 0 0 0); }
    .swipe, .cell b, .par, .replay { transition: none; }
    .par.on { transform: none; }
  }
</style>

<script>
// A shared link of the older shape — /oneatatime/?given=warm&target=cold —
// lands here rather than on the board. Hand it straight through to the game.
(function () {
  var q = window.location.search;
  var p = new URLSearchParams(q);
  if (p.get('given') && p.get('target')) {
    window.location.replace('play.html' + q);
  }
})();

// --- The demo ladder -------------------------------------------------------
// WARM → COLD in four, the real shortest route, which also happens to move
// each of the four letters exactly once.
var LADDER = [
  { word: 'warm', hit: -1, tag: 'start' },
  { word: 'ward', hit: 3 },
  { word: 'card', hit: 0 },
  { word: 'cord', hit: 1 },
  { word: 'cold', hit: 2, tag: 'goal' }
];

// No two swipes are identical, and none of them is random: a mark that rolled
// fresh numbers would twitch on every replay. Angle, width, drop and corner are
// fixed per rung, the way the app seeds each mark on its own identity.
var MARKS = [
  null,
  { rot: '-3.4deg', w: '120%', dy: '1px',  r: '8px' },
  { rot: '2.6deg',  w: '112%', dy: '-1px', r: '6px' },
  { rot: '-1.8deg', w: '124%', dy: '2px',  r: '9px' },
  { rot: '3.2deg',  w: '116%', dy: '0px',  r: '7px' }
];

var ladder  = document.getElementById('ladder');
var parEl   = document.getElementById('par');
var replayEl= document.getElementById('replay');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var timers  = [];

function buildRung(step, index) {
  var rung = document.createElement('div');
  rung.className = 'rung' + (step.tag === 'goal' ? ' goal' : '');

  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = step.tag || '';
  rung.appendChild(tag);

  var cells = document.createElement('span');
  cells.className = 'cells';
  for (var i = 0; i < step.word.length; i++) {
    var cell = document.createElement('span');
    cell.className = 'cell' + (i === step.hit ? ' hit' : '');
    if (i === step.hit) {
      var m = MARKS[index];
      var swipe = document.createElement('i');
      swipe.className = 'swipe';
      swipe.style.setProperty('--rot', m.rot);
      swipe.style.setProperty('--w', m.w);
      swipe.style.setProperty('--dy', m.dy);
      swipe.style.setProperty('--r', m.r);
      cell.appendChild(swipe);
    }
    var glyph = document.createElement('b');
    glyph.textContent = step.word[i];
    cell.appendChild(glyph);
    cells.appendChild(cell);
  }
  rung.appendChild(cells);

  rung.appendChild(document.createElement('span')); // mirror gutter, keeps letters centred
  return rung;
}

// Every rung exists from the first frame so the ladder never reflows and, more to the
// point, so the goal is on screen before the first letter moves — the whole game is
// aiming at that word, and an animation that reveals it last doesn't say so.
function layout() {
  ladder.innerHTML = '';
  return LADDER.map(function (step, i) {
    var rung = buildRung(step, i);
    if (i > 0) rung.classList.add('pending');
    ladder.appendChild(rung);
    return rung;
  });
}

function run() {
  timers.forEach(clearTimeout);
  timers = [];
  parEl.classList.remove('on');
  replayEl.classList.remove('on');

  var rungs = layout();
  // The goal is legible from the start; only its swipe waits for the move that lands
  // on it, so arriving still reads as arriving.
  rungs[rungs.length - 1].classList.remove('pending');

  if (reduced) {
    rungs.forEach(function (rung, i) {
      rung.classList.remove('pending');
      rung.classList.add('drawn');
      if (i < rungs.length - 1) rung.classList.add('past');
    });
    parEl.classList.add('on');
    replayEl.classList.add('on');
    return;
  }

  rungs.forEach(function (rung, i) {
    if (i === 0) return;
    timers.push(setTimeout(function () {
      rungs[i - 1].classList.add('past');
      rung.classList.remove('pending');
      // One frame un-drawn, so the swipe has a state to animate out of and the
      // glyph has a colour to transition from.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { rung.classList.add('drawn'); });
      });
    }, 700 + (i - 1) * 850));
  });

  timers.push(setTimeout(function () {
    parEl.classList.add('on');
    replayEl.classList.add('on');
  }, 700 + LADDER.length * 850));
}

replayEl.addEventListener('click', run);
run();
</script>
