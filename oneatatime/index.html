<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>one · at · a · time — a word ladder puzzle</title>
<meta name="description" content="Turn one word into another by changing one letter at a time. Every step has to be a real word. Coming to iPhone and iPad.">
<meta name="theme-color" content="#FCFBF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15151A" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://squaresga.me/oneatatime/">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
<meta property="og:title" content="one · at · a · time">
<meta property="og:description" content="Turn one word into another by changing one letter at a time. Every step has to be a real word.">
<meta property="og:image" content="https://squaresga.me/oneatatime/img/icon-1024.png">
<meta property="og:url" content="https://squaresga.me/oneatatime/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  /* --- Marker ---------------------------------------------------------------
     The game's personality, carried over from the app: a page someone got at
     with highlighters. The letter that moved wears a thin fluorescent rule
     under it; everything else stays pencil.

     One hard rule, inherited from Palette.swift: fluorescent yellow is a fill,
     never a foreground. Nothing on this page is set *in* it — which is part of
     why the mark goes under the letter rather than across it.
     ------------------------------------------------------------------------ */
  :root {
    --canvas:    #FCFBF4;
    --hairline:  #E6E3D6;
    --ink:       #141414;
    --ink-soft:  #4F4E48;
    --ink-faint: #93918A;
    --primary:   #FFCF00;
    --success:   #00A870;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:    #15151A;
      --hairline:  #35353F;
      --ink:       #F7F6F0;
      --ink-soft:  #C0BFB6;
      --ink-faint: #77766F;
      --primary:   #FFE23D;
      --success:   #3DFFB0;
    }
  }

  /* --- Two faces, and who owns them -----------------------------------------
     Every name on this site is set in the face of the thing it names. This game
     is rounded, the way the app is; squares is Optic, and so is nickpyati.com.
     Nothing borrows the other's letterforms, on either page.
     ------------------------------------------------------------------------ */

  /* The app sets every word in SF Pro Rounded — `.rounded` in Palette.swift. On
     Apple platforms `ui-rounded` reaches that exact face from the system, which
     is the best this page can do: Apple's licence does not permit the file to be
     served from a website. Everywhere else, Nunito stands in — the nearest
     rounded sans that is free to host, and the reason this page no longer falls
     back to a grotesque with none of the game's warmth. */
  @font-face {
    font-family: 'Nunito';
    src: url('fonts/nunito-latin.woff2') format('woff2');
    /* The range matters. This is one variable file whose default instance is
       ExtraLight — declare it without a range and every browser reads the whole
       face as weight 200, then fakes the Black by smearing the outlines. */
    font-weight: 200 1000;
    font-style: normal;
    font-display: swap;
  }

  /* Optic, the face squares is set in — and nickpyati.com with it. Used here for
     the squares row in the footer and for the credit below it, so both read as
     belonging where they point rather than to this page. Injected at deploy time
     from repository secrets. */
  @font-face {
    font-family: 'Optic';
    src: url('/fonts/Optic-Bold.otf') format('opentype');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Optic';
    src: url('/fonts/Optic-Book.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --face-oaat: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --face-squares: 'Optic', -apple-system, BlinkMacSystemFont,
                    'Helvetica Neue', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: var(--face-oaat);
    background: var(--canvas);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 56px 24px 40px;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
  }

  /* --- Wordmark ----------------------------------------------------------- */
  /* Set live, exactly the way Wordmark.swift sets it: the rounded black the rest
     of the game is set in, lowercase, tracked in a touch, with undersized faint
     interpuncts pacing the phrase.

     This used to be traced SVG outlines lifted from the old browser build. Those
     outlines were neither this face nor evenly spaced — the gaps either side of
     the lone "a" ran a third wider than the one after "one" — and being artwork
     rather than type, the spacing couldn't be fixed without redrawing them. */
  .wordmark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .16em;
    font-size: clamp(30px, 8.8vw, 44px);
    font-weight: 900;
    letter-spacing: -.02em;
    line-height: 1.15;
    color: var(--ink);
  }
  /* Quiet and small. At the mark's own weight the dots competed with the
     letterforms and read as debris; undersized they do what punctuation is for. */
  .wordmark i {
    font-style: normal;
    font-size: .62em;
    color: var(--ink-faint);
  }

  .tagline {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.01em;
  }

  /* --- The ladder --------------------------------------------------------- */
  .ladder {
    margin: 44px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  /* Three columns rather than a plain row: a gutter for the start/goal labels, the
     four letters, and a mirror of the gutter so the letters stay centred on the page
     whatever the labels say. */
  .rung {
    display: grid;
    grid-template-columns: 46px max-content 46px;
    align-items: center;
  }
  .cells { display: flex; gap: 3px; }

  .tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: right;
    padding-right: 10px;
  }

  /* Both ends of the ladder are on screen from the first frame. Without the goal
     sitting there the animation looked like letters changing for their own sake —
     you couldn't see there was a word being aimed at. */
  .rung.pending { visibility: hidden; }
  .rung.goal { margin-top: 11px; }

  .cell {
    position: relative;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell b {
    position: relative;
    z-index: 1;
    font-size: 29px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--ink);
    transition: color .3s ease, opacity .5s ease;
  }

  /* History. Every rung that isn't live fades to the same degree — the question
     the board answers is "is this the word I'm working on", which is binary. */
  .rung.past .cell b { opacity: .34; }
  /* The mark doesn't recede as far as the row it sits on. It is the only record
     of which column moved, and a 4px rule taken down to a third of its ink is
     nothing at all. Holding the marks up while the letters drop back is also
     what turns them into a trail: a legible line of steps across four columns. */
  .rung.past .mark { opacity: .62; }

  /* The letter that moved is underlined, not highlighted — the same mark the app
     draws beneath a rung it has climbed. Thin, dropped well clear of the
     baseline, and never quite straight: these letters are set in a black weight
     with a large cap height, so a rule any closer stops reading as a mark under
     the letter and starts reading as part of it. */
  .mark {
    position: absolute;
    left: 50%;
    /* 90% of the cell, which is where font × 0.58 below the glyph's centre lands
       at both sizes this board is set at. */
    top: 90%;
    width: var(--w, 104%);
    height: 4px;
    background: var(--primary);
    border-radius: 2px;
    transform: translate(calc(-50% + var(--dx, 0px)), -50%) rotate(var(--rot, -2deg));
    /* Drawn, not revealed — it's the game's one gesture, so it behaves like a
       gesture. Left to right, the way a real stroke goes. */
    clip-path: inset(0 100% 0 0);
    transition: opacity .5s ease;
  }
  .rung.drawn .mark { animation: draw .34s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes draw { to { clip-path: inset(0 0 0 0); } }

  /* The goal is on screen from the first frame, but until the ladder reaches it
     it is somewhere to get to rather than a word already played — so it is set
     softer than the rungs, and turns green on arrival. */
  .rung.goal .cell b { color: var(--ink-soft); }
  .rung.goal.drawn .cell b { color: var(--success); }
  .rung.goal.drawn .tag { color: var(--success); }

  .replay {
    margin-top: 26px;
    background: none;
    border: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity .3s ease, color .15s ease;
  }
  .replay.on { opacity: 1; }
  .replay:hover { color: var(--ink-soft); }

  /* --- Rules -------------------------------------------------------------- */
  .rules {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .rules span:last-child { color: var(--ink-faint); }

  /* --- What's coming ------------------------------------------------------ */
  /* No button. The thing being announced is the app, and there isn't one to link
     to yet — a browser build advertised here would only compete with it. */
  .coming {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px 13px 16px;
    border: 1px solid var(--hairline);
    border-radius: 13px;
  }
  .coming img { width: 34px; height: 34px; border-radius: 8px; display: block; }
  .coming span { font-size: 15px; font-weight: 700; color: var(--ink); }

  /* --- Footer ------------------------------------------------------------- */
  footer {
    width: 100%;
    max-width: 420px;
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    text-align: center;
  }
  .meta { font-size: 12px; font-weight: 500; color: var(--ink-faint); }
  .meta a { color: var(--ink-faint); text-decoration: none; }
  .meta a:hover { color: var(--ink-soft); }
  .meta .sep { margin: 0 7px; opacity: .5; }

  /* The other game on this site. Squares is the headline, so it gets a real
     row here rather than a link buried in the fine print — its own app icon
     rather than an approximation of it, and its own face: this row is the one
     thing on the page that isn't this game, so it is set in Optic and tracked
     the way the squares homepage sets its own name. */
  .sibling {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    text-align: left;
    text-decoration: none;
    transition: opacity .15s ease;
  }
  .sibling:hover { opacity: .72; }
  .sibling img { width: 30px; height: 30px; border-radius: 7px; display: block; }
  .sibling b {
    display: block;
    font-family: var(--face-squares);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -.2px;
    color: var(--ink);
  }
  .sibling em {
    display: block;
    font-family: var(--face-squares);
    font-style: normal;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* Set in Optic, the face nickpyati.com uses, and cased and tracked the way that
     site sets the name itself. */
  .byline {
    display: inline-block;
    margin-top: 20px;
    font-family: var(--face-squares);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-faint);
    transition: color .15s ease;
  }
  .byline:hover { color: var(--ink-soft); }

  @media (max-width: 400px) {
    body { padding-top: 40px; }
    .cell { width: 38px; height: 38px; }
    .cell b { font-size: 26px; }
    .rung { grid-template-columns: 40px max-content 40px; }
    .tag { font-size: 9px; padding-right: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rung.drawn .mark { animation: none; clip-path: inset(0 0 0 0); }
    .mark, .cell b, .replay { transition: none; }
  }
</style>
</head>
<body>

<main>

  <h1 class="wordmark" aria-label="one at a time">
    <span>one</span><i aria-hidden="true">&middot;</i><span>at</span><i aria-hidden="true">&middot;</i><span>a</span><i aria-hidden="true">&middot;</i><span>time</span>
  </h1>

  <p class="tagline">a word ladder puzzle</p>

  <div class="ladder" id="ladder" aria-label="warm, ward, card, cord, cold"></div>
  <button class="replay" id="replay" type="button">replay</button>

  <div class="rules">
    <span>Get from the start word to the goal.</span>
    <span>Change <b>one letter at a time</b>.</span>
    <span>Every step has to be a real word.</span>
  </div>

  <!-- When the app ships, swap this block for the App Store badge, the same way
       the squares homepage carries one:
       <a href="https://apps.apple.com/app/idXXXXXXXXX"><picture>…</picture></a> -->
  <div class="coming">
    <img src="img/icon-180.png" alt="" width="34" height="34">
    <span>iOS app coming soon</span>
  </div>

</main>

<footer>
  <a class="sibling" href="/">
    <img src="/apple-touch-icon.png" alt="" width="30" height="30">
    <span>
      <b>squares</b>
      <em>compounding complexity</em>
    </span>
  </a>
  <div class="meta">
    <a href="privacy.html">privacy</a>
    <span class="sep">&middot;</span>
    <a href="support.html">support</a>
  </div>
  <a class="byline" href="https://nickpyati.com">Nick Pyati</a>
</footer>

<script>
// A shared link of the older shape — /oneatatime/?given=warm&target=cold —
// lands here rather than on the board. Hand it straight through to the game.
(function () {
  var q = window.location.search;
  var p = new URLSearchParams(q);
  if (p.get('given') && p.get('target')) {
    window.location.replace('play.html' + q);
  }
})();

// --- The demo ladder -------------------------------------------------------
// WARM → COLD in four, the real shortest route, which also happens to move
// each of the four letters exactly once.
var LADDER = [
  { word: 'warm', hit: -1, tag: 'start' },
  { word: 'ward', hit: 3 },
  { word: 'card', hit: 0 },
  { word: 'cord', hit: 1 },
  { word: 'cold', hit: 2, tag: 'goal' }
];

// No two marks are identical, and none of them is random: a mark that rolled
// fresh numbers would twitch on every replay. Angle, width and drift are fixed
// per rung, the way the app seeds each mark on its own identity. The angles run
// mostly anticlockwise because a right hand dragging left to right rises.
var MARKS = [
  null,
  { rot: '-3.1deg', w: '108%', dx: '-1px' },
  { rot: '0.6deg',  w: '99%',  dx: '1px'  },
  { rot: '-2.4deg', w: '112%', dx: '0px'  },
  { rot: '-1.2deg', w: '103%', dx: '1px'  }
];

var ladder  = document.getElementById('ladder');
var replayEl= document.getElementById('replay');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var timers  = [];

function buildRung(step, index) {
  var rung = document.createElement('div');
  rung.className = 'rung' + (step.tag === 'goal' ? ' goal' : '');

  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = step.tag || '';
  rung.appendChild(tag);

  var cells = document.createElement('span');
  cells.className = 'cells';
  for (var i = 0; i < step.word.length; i++) {
    var cell = document.createElement('span');
    cell.className = 'cell' + (i === step.hit ? ' hit' : '');
    if (i === step.hit) {
      var m = MARKS[index];
      var mark = document.createElement('i');
      mark.className = 'mark';
      mark.style.setProperty('--rot', m.rot);
      mark.style.setProperty('--w', m.w);
      mark.style.setProperty('--dx', m.dx);
      cell.appendChild(mark);
    }
    var glyph = document.createElement('b');
    glyph.textContent = step.word[i];
    cell.appendChild(glyph);
    cells.appendChild(cell);
  }
  rung.appendChild(cells);

  rung.appendChild(document.createElement('span')); // mirror gutter, keeps letters centred
  return rung;
}

// Every rung exists from the first frame so the ladder never reflows and, more to the
// point, so the goal is on screen before the first letter moves — the whole game is
// aiming at that word, and an animation that reveals it last doesn't say so.
function layout() {
  ladder.innerHTML = '';
  return LADDER.map(function (step, i) {
    var rung = buildRung(step, i);
    if (i > 0) rung.classList.add('pending');
    ladder.appendChild(rung);
    return rung;
  });
}

function run() {
  timers.forEach(clearTimeout);
  timers = [];
  replayEl.classList.remove('on');

  var rungs = layout();
  // The goal is legible from the start; only its mark and its green wait for the
  // move that lands on it, so arriving still reads as arriving.
  rungs[rungs.length - 1].classList.remove('pending');

  if (reduced) {
    rungs.forEach(function (rung, i) {
      rung.classList.remove('pending');
      rung.classList.add('drawn');
      if (i < rungs.length - 1) rung.classList.add('past');
    });
    replayEl.classList.add('on');
    return;
  }

  rungs.forEach(function (rung, i) {
    if (i === 0) return;
    timers.push(setTimeout(function () {
      rungs[i - 1].classList.add('past');
      rung.classList.remove('pending');
      // One frame un-drawn, so the mark has a state to animate out of and the
      // glyph has a colour to transition from.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { rung.classList.add('drawn'); });
      });
    }, 700 + (i - 1) * 850));
  });

  timers.push(setTimeout(function () {
    replayEl.classList.add('on');
  }, 700 + LADDER.length * 850));
}

replayEl.addEventListener('click', run);
run();
</script>

</body>
</html>
